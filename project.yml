name: Folio
options:
  bundleIdPrefix: com.irenapoghosyan
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: G6AA4T82BJ

packages:
  FolioKit:
    path: Packages/FolioKit

targets:
  Folio:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FolioKit
        product: ResumeCore
      - package: FolioKit
        product: ResumeUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irenapoghosyan.folio
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Folio:
    build:
      targets:
        Folio: all
    # ⌘U on the app scheme runs every module's tests.
    test:
      gatherCoverageData: true
      targets:
        - package: FolioKit/ResumeCoreTests
        - package: FolioKit/ResumeUITests
